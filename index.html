<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="manifest.webmanifest">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070a;color:#e9f7ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;max-width:720px;margin:auto;padding:24px 18px 28px}
h1{font-size:42px;letter-spacing:.12em;margin:10px 0 2px}.sub{color:#7e9aaa}.status{margin:22px 0;padding:14px;border:1px solid #1e3b48;border-radius:16px;background:#091117}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#36d399;margin-right:8px}.messages{flex:1;display:flex;flex-direction:column;gap:12px;overflow:auto;margin:8px 0 18px}
.msg{padding:13px 15px;border-radius:16px;max-width:90%;white-space:pre-wrap}.jarvis{background:#0b1820;align-self:flex-start}.you{background:#123247;align-self:flex-end}
.controls{display:flex;gap:10px}.controls button{flex:1;padding:17px;border:0;border-radius:16px;font-size:17px;font-weight:700}.mic{background:#d9f4ff;color:#071017}.stop{background:#25333a;color:white}.small{font-size:13px;color:#7e9aaa;margin-top:12px;text-align:center}
</style>
</head>
<body>
<main>
<h1>JARVIS</h1><div class="sub">Universal Wearable Assistant</div>
<div class="status"><span class="dot"></span><span id="route">Checking audio route…</span></div>
<div id="messages" class="messages">
<div class="msg jarvis">JARVIS online. Connect your glasses, headphones, or car Bluetooth and I will use the active audio route.</div>
</div>
<div class="controls"><button class="mic" id="mic">🎙️ Talk to JARVIS</button><button class="stop" id="stop">Stop</button></div>
<div class="small">Microphone access is required. Your Bluetooth device is managed by iOS.</div>
</main>
<script src="app.js"></script>
</body>
</html>
